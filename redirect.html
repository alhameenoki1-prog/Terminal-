<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Change the URL below (in BOTH places) to your own website -->
  <meta http-equiv="refresh" content="2; url=https://example.com">
  <title>Redirecting…</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
           display: flex; min-height: 100vh; margin: 0; align-items: center;
           justify-content: center; background: #0f172a; color: #e2e8f0; }
    .box { text-align: center; padding: 24px; }
    a { color: #60a5fa; }
  </style>
</head>
<body>
  <div class="box">
    <p>Taking you to my website…</p>
    <p>If nothing happens, <a href="https://example.com">click here</a>.</p>
  </div>
  <script>
    // Fallback redirect in case meta refresh is blocked.
    setTimeout(function () { window.location.href = "https://example.com"; }, 2000);
  </script>
</body>
</html>
