<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Change the URL below (in BOTH places) to your own website -->
  <meta http-equiv="refresh" content="0; url=https://example.com">
  <title>Redirecting…</title>
  <script>
    // Redirects immediately; fallback if meta refresh is blocked.
    window.location.replace("https://example.com");
  </script>
</head>
<body>
  <p>If you are not forwarded automatically, <a href="https://example.com">click here</a>.</p>
</body>
</html>
